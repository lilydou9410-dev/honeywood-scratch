<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6df"><title>Honeywood｜500人記念スクラッチ</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 8%,#fff 0,#fff8e9 36%,#f9e8c9 100%);color:#795338;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;display:grid;place-items:center;padding:22px}.card{width:min(100%,430px);background:#fffdf7;border:2px solid #eed7a7;border-radius:28px;box-shadow:0 15px 45px #98703c24;text-align:center;padding:27px 20px 24px}.bee{font-size:40px}.brand{font-family:Georgia,serif;font-size:36px;font-weight:700;color:#aa7b42;letter-spacing:1px;margin:5px}.tag{color:#a27a53;font-size:12px;letter-spacing:3px;font-weight:bold}.title{font-size:24px;font-weight:800;margin:15px 0 8px}.desc{font-size:13px;line-height:1.8;color:#97785e}.scratch{position:relative;width:100%;max-width:320px;height:160px;margin:22px auto 15px;border:4px solid #e9bf70;border-radius:20px;overflow:hidden;background:#fff0c7;touch-action:none;user-select:none}.prize{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.prize .amount{font-size:43px;font-weight:900;color:#ba7535}.prize .small{font-size:12px;color:#98663d}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.action{width:100%;max-width:320px;background:#b98246;color:white;border:0;border-radius:99px;padding:14px 16px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #906034}.action:active{transform:translateY(2px)}.action:disabled{background:#bcb1a1;box-shadow:none;cursor:default}.hint{font-size:12px;color:#997d61;margin:13px 0}.result{display:none;margin:16px auto 0;padding:13px;background:#fff3d8;border-radius:14px;max-width:320px;font-size:13px;line-height:1.8}.result strong{font-size:18px;color:#ac713d}.terms{font-size:11px;color:#a48b73;line-height:1.7;margin-top:22px}.link{color:#946232}#status{font-size:12px;color:#986c43;min-height:18px}
</style></head><body><main class="card"><div class="bee">🐝🍯</div><div class="brand">Honeywood</div><div class="tag">THANK YOU FOR 500 FOLLOWERS</div><h1 class="title">500人突破記念 🎉</h1><div class="desc">いつも応援ありがとうございます♡<br>ハズレなし！スクラッチで割引をGET！</div><div class="scratch" id="scratch"><div class="prize"><div class="small">おめでとうございます 🎁</div><div class="amount" id="amount">—</div><div class="small">次回のお買い物で使える割引</div></div><canvas id="cover" aria-label="ここを指でこすってください"></canvas></div><div id="status">指でこすってスクラッチを削ってね ✨</div><p class="hint">削れない場合は下のボタンを押してください</p><button class="action" id="reveal" type="button">タップして結果を見る ♡</button><div class="result" id="result"><strong id="resultAmount"></strong><div>当選結果をスクリーンショットして<br>HoneywoodのLINEにお送りください♡</div><button class="action" style="margin-top:10px" id="copy" type="button">当選結果をコピー</button></div><div class="terms">※ お一人様1回限り・割引の併用条件は店舗案内をご確認ください。<br>※ この体験版は同じブラウザでの再抽選を制限します。<br>※ 正式な本人確認・重複防止には別途認証が必要です。</div></main><script>
(()=>{'use strict';const KEY='honeywood500_v1';const canvas=document.getElementById('cover'),box=document.getElementById('scratch'),button=document.getElementById('reveal'),status=document.getElementById('status'),result=document.getElementById('result'),amount=document.getElementById('amount'),resultAmount=document.getElementById('resultAmount');let stored=null;try{stored=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}let prize=stored&&[50,100,200].includes(stored.prize)?stored.prize:null;let revealed=!!prize;let drawing=false,ctx,marks=0;function choose(){let n=crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;return n<.5?50:n<.8?100:200}function ensurePrize(){if(!prize){prize=choose();try{localStorage.setItem(KEY,JSON.stringify({prize,at:new Date().toISOString()}))}catch(e){}}amount.textContent='¥'+prize+' OFF';resultAmount.textContent='¥'+prize+' OFF'}function finish(){ensurePrize();revealed=true;canvas.style.display='none';result.style.display='block';status.textContent='当選おめでとうございます！🎊';button.textContent='結果を確認済み';button.disabled=true}function paint(){if(revealed){finish();return}let rect=box.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d8b474';ctx.fillRect(0,0,rect.width,rect.height);ctx.fillStyle='#fff8e8';ctx.textAlign='center';ctx.font='bold 22px sans-serif';ctx.fillText('SCRATCH HERE ✨',rect.width/2,rect.height/2-4);ctx.font='13px sans-serif';ctx.fillText('ここをこすってね ♡',rect.width/2,rect.height/2+24)}function scratch(e){if(revealed||!ctx)return;e.preventDefault();ensurePrize();let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);ctx.fill();marks++;if(marks>22)finish()}canvas.addEventListener('pointerdown',e=>{drawing=true;try{canvas.setPointerCapture(e.pointerId)}catch(_){}scratch(e)});canvas.addEventListener('pointermove',e=>{if(drawing)scratch(e)});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);button.addEventListener('click',finish);document.getElementById('copy').addEventListener('click',async()=>{let s='Honeywood 500人記念スクラッチ：¥'+prize+' OFF';try{await navigator.clipboard.writeText(s);document.getElementById('copy').textContent='コピーしました ✓'}catch(e){window.prompt('こちらをコピーしてください',s)}});window.addEventListener('resize',()=>{if(!revealed)paint()});if(revealed)finish();else paint();})();
</script></body></html>
